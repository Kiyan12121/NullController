# Players who have run /bottestverify. Add or remove UUIDs here,
# then run /nullreload in game to apply changes.
consented-players: []

# Army size. Hard ceiling of 200 is enforced in code.
max-nulls: 20

# Nulls spawned per tick batch, so the server doesn't freeze on big summons.
spawn-batch: 5

# Citizens skin name for the black Null skin.
null-skin: NULL

# Distance a Null may drift from its formation slot before being teleported back.
leash-distance: 15

# Radius Nulls use to find roster players in HUNT mode.
hunt-range: 100

# Radius Nulls use to find hostile mobs to fight.
combat-range: 8

# Damage per hit Nulls land on mobs and hunted roster players.
combat-damage: 8

# Blocks placed per tick while building. Lower it if the server lags.
build-blocks-per-tick: 4

# Chest where Nulls empty their packs. Set in game: look at a chest, run /nullcmd chest set.
deposit-chest: ""

# Forge block for FORGE DUTY. Set in game: look at it, run /nullcmd forge set.
forge-block: ""

# Nether ambush: two hunters for roster players entering the Nether. Toggle with /nullcmd ambush on|off.
nether-ambush: false
ambush-minutes: 3

# Invasion: /nullcmd invade <player>
invasion-size: 6
invasion-minutes: 10

# Totem of NULL: charges per totem. When they run out, the army disbands.
totem-charges: 3
army-cooldown-minutes: 30

# Set automatically by the plugin when a totem is issued or succession happens. Don't edit by hand.
active-totem-id: ""

# Roaming: how far Nulls wander from their leader or from you.
roam-radius: 12

# Repairs the last build every N minutes when it is idle and something is missing.
auto-fortify-minutes: 3

# Alarm: this many hostile mobs within 16 blocks of you rallies the army for 30 seconds.
alarm-threshold: 5

# Blocks per tick while the Null Civilisation is building. It is larger than other builds.
city-blocks-per-tick: 12

# Black Null skin, fetched by Citizens from this URL. Leave empty to use null-skin instead.
null-skin-url: https://raw.githubusercontent.com/Kiyan12121/NullController/main/skins/null-black.png

# Blocks per tick while the Metropolis builds. It is about 170,000 blocks, so the rate is higher.
metropolis-blocks-per-tick: 40

# How far from the city centre the Enderman and chorus fruit sweep reaches.
sweep-radius: 120

# Auto-update: checks the latest GitHub release every six hours and stages a newer jar for the next restart.
auto-update: true
update-repo: Kiyan12121/NullController
# Nether base: where stasis pulls roster players. Set in game with /nullrod base set.
nether-base: ""

# Machines switched on at the Nether base. Set with /nullbase build <kind>.
base-machines: []

# Read-only GitHub token, needed only while the repo is private. Leave empty for a public repo.
update-token: ""

# Nether law. The Nether is owned. Roster players only. Strikes reset after a visit's warning cooldown.
nether-warning-minutes: 10
nether-hunt-minutes: 5
# Prison: set in game with /nullnether prison set. Prisoners must stay inside this radius.
prison: ""
prison-radius: 25
prison-food-minutes: 5
prisoner-blocked-commands:
  - home
  - homes
  - sethome
  - tp
  - tpa
  - tpahere
  - tpaccept
  - tpo
  - tpohere
  - spawn
  - warp
  - back
  - ec
  - enderchest

# Offline: when you're away, the Nulls summon replacements themselves until this many are out.
offline-army: 10
# Offline defence: a roster player who comes near a Null is hunted by temporary Nulls for this long.
defence-minutes: 3

# Team: allies the Null weapons (rods, strikes, mob cannon) never hit. Manage with /nullcmd team add|remove|list.
allies: []

# The Commander's voice: type "null <message>" in chat. Needs a Groq API key. Keep the key private.
groq-api-key: ""
groq-model: "llama-3.3-70b-versatile"

# The Commander's build designer. Biggest build allowed (blocks), and blocks placed per batch.
build-max-volume: 2000000
build-placements-per-tick: 300
