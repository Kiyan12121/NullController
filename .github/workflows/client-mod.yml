name: Build NullClient mod

on:
  push:
    branches: [main]
    paths:
      - 'client-mod/**'
      - '.github/workflows/client-mod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Diagnose plugin repositories
        run: |
          for u in https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml https://plugins.gradle.org/m2/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml; do
            echo "$u -> $(curl -s -o /tmp/meta.xml -w '%{http_code}' "$u")"
            grep -oE '<version>1\.1[3-9][^<]*</version>' /tmp/meta.xml | tr '\n' ' ' || true; echo
          done

      - name: Build the mod
        working-directory: client-mod
        run: gradle build --no-daemon

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: NullClient-mod
          path: client-mod/build/libs/nullclient-*.jar
          if-no-files-found: error
