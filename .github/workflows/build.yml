name: Build NullController

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: NullController
          path: target/NullController-${{ steps.ver.outputs.version }}.jar

      - name: Publish release for in-game updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          JAR="target/NullController-${{ steps.ver.outputs.version }}.jar"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "NullController $TAG" --notes "Automatic build from main."
          fi
